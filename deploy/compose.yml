services:
  nesti:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nesti
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/data/notes.db
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-secure-secret-32-chars-min}
      - WEB_DIST_PATH=${WEB_DIST_PATH:-apps/web/dist}
    volumes:
      - nesti-data:/data

volumes:
  nesti-data:
    driver: local
